# onramp - docker-compose for container-ready workers built on
# this template. The stdio MCP server itself is run NATIVELY by the MCP
# client (LM Studio, Claude Desktop, ...) on the host, never through this
# compose file - see README.md's "Docker" section for why. Use this to run
# a standalone worker/scheduled script that shares the same code and var/
# layout as the server.
services:
  mcp-server:
    build: .
    volumes:
      # Runtime state/logs/reports persist across container restarts and
      # stay inspectable from the host. See src/core/paths.mjs.
      - ./var:/app/var
      # .env is GENERATED by `npm run env-sync` from Doppler - never baked
      # into the image, mounted read-only so a container can't rewrite it.
      - ./.env:/app/.env:ro
    environment:
      - NODE_ENV=production
    # Example worker invocation once you add one under scripts/:
    # command: ["node", "scripts/your-worker.mjs"]
